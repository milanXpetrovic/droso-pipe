# droso-pipe on TrueNAS: Apps -> droso -> Edit (or Install via YAML for a new install).
# Replace every CHANGE_ME. The DB password must stay the same as the one the database was created with.

x-django: &django
  image: ghcr.io/milanxpetrovic/droso-pipe-app:v0.8.0
  restart: unless-stopped
  user: "3002:3003"                         # pipeline
  group_add: ["3000", "3001", "3002"]       # lab, labdata, worker
  environment: &django-env
    DJANGO_DEBUG: "0"
    DJANGO_SECRET_KEY: CHANGE_ME_LONG_RANDOM_STRING
    DJANGO_ALLOWED_HOSTS: 10.11.48.18,lab-nas,lab-nas.local
    DJANGO_CSRF_TRUSTED_ORIGINS: http://10.11.48.18:8080,http://lab-nas:8080,http://lab-nas.local:8080
    DJANGO_MEDIA_ROOT: /data/media
    DROSO_VIDEOS_ROOT: /data/videos
    POSTGRES_DB: droso
    POSTGRES_USER: droso
    POSTGRES_PASSWORD: CHANGE_ME_DB_PASSWORD
    POSTGRES_HOST: db

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: droso
      POSTGRES_USER: droso
      POSTGRES_PASSWORD: CHANGE_ME_DB_PASSWORD
    volumes:
      - /mnt/lab/apps/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U droso -d droso"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    <<: *django
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /mnt/lab/apps/media:/data/media
      - /mnt/lab/videos:/data/videos
    ports:
      - "8080:8000"

  keeper:                                   # ingest to raw/, plan runs, store worker results
    <<: *django
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["python", "manage.py", "keeper", "--loop"]
    volumes:
      - /mnt/lab/videos:/data/videos

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: CHANGE_ME_DB_PASSWORD
    volumes:
      - /mnt/lab/apps/backups:/backups
    entrypoint: >
      sh -c 'while true; do
               pg_dump -h db -U droso -Fc droso > /backups/droso-$$(date +%F).dump.tmp &&
               mv /backups/droso-$$(date +%F).dump.tmp /backups/droso-$$(date +%F).dump;
               find /backups -name "droso-*.dump" -mtime +30 -delete;
               sleep 86400;
             done'
