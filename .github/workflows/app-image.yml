# Builds the Django app image and pushes it to GitHub Container Registry
# when a tag like app-v0.1.0 is pushed:   git tag app-v0.1.0 && git push origin app-v0.1.0
name: app image

on:
  push:
    tags: ["app-v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        working-directory: app
        run: |
          pip install -r requirements.txt
          python manage.py test domain intake core

      - name: Lowercase owner (GHCR needs lowercase names)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER }}/droso-pipe-app
          tags: |
            type=match,pattern=app-(v.*),group=1

      - uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
