# Seed catalogues. Load with:  python manage.py loaddata catalogs

- model: domain.genotype
  pk: 1
  fields: {code: CS, name: Canton-S}

- model: domain.eventkind
  pk: 1
  fields:
    code: divider_removed
    name: Divider removed
    is_interval: false
    description: Wall arena divider taken out; the two sides join.

- model: domain.eventkind
  pk: 2
  fields:
    code: vapor_puff
    name: Vapor puff
    is_interval: true
    description: Substance vapor delivered into the arena.
    param_schema:
      type: object
      required: [substance, dose, dose_unit]
      properties:
        substance: {type: string, minLength: 1}
        dose: {type: number, minimum: 0}
        dose_unit: {type: string, enum: [ug, mg, ul, ml, percent]}
        flow_ml_min: {type: number, minimum: 0}
      additionalProperties: false

- model: domain.eventkind
  pk: 3
  fields:
    code: note
    name: Note
    is_interval: false
    description: Anything worth marking in time (disturbance, fly escaped, ...).